version: 2

# Public repo supply-chain protection — SECURITY-ONLY mode (2026-08-22).
#
# Dependabot *security* updates stay on (repo setting: automated security
# fixes enabled) so a vulnerable dependency still gets a patch PR ASAP.
# Scheduled *version* updates are OFF for every ecosystem
# (open-pull-requests-limit: 0): the weekly minor/patch bump PRs produced
# far more notification noise than value and left stale branches behind.
# Keeping the ecosystem entries (instead of deleting the file) lets the
# security PRs keep their commit-message prefix and major-bump ignore rules.
#
# To re-enable version updates for one ecosystem, raise its limit (> 0).

updates:
  - package-ecosystem: "npm"
    directory: "/core/landing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/core/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(actions)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/core/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/core/landing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
