name: Backend Full Suite

# Runs the WHOLE backend test suite on every PR + main push. The existing
# `test-postgres` check only runs `-m postgres_only` (the RLS subset), so a
# regression anywhere else in the suite never blocked a merge — five stale
# tests were red on main for a while before anyone noticed. This job closes
# that gap; once it's reporting green it should be added to the branch's
# required status checks.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: core/backend
    env:
      # Deterministic SQLite test lane (matches how the suite is run locally);
      # the Postgres/RLS-specific cases keep their own `test-postgres` job.
      ABS_TEST_MODE: "1"
      # Retrieval refuses to run on the sha256 `mock` backend, by design; with no
      # Ollama on the runner the suite fell back to `none` and 36 RAG tests failed
      # with search_unavailable. A 130 MB CPU model is the honest fix; cached.
      ABS_EMBEDDING_BACKEND: sentence_transformers
      ABS_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      # Seven tests exercise the provider cascade through its real entry point
      # (judge, workflow llm_call, the caller's-key rule) with the HTTP layer
      # mocked; the cascade still refuses to start with no free provider
      # configured ("no_provider_configured"). The same secret the scenarios
      # workflow already uses. Dependabot PRs get no secrets and skip the job.
      # Settings read with env_prefix ABS_, so the bare name is never seen.
      ABS_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Install a small real embedder (CPU torch + sentence-transformers)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers
      - name: Run full backend test suite
        run: pytest -q --ignore=tests/integration
